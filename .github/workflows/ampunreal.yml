name: AmpUnreal CI

on:
  push:
    paths: ["AmpUnreal/**", ".github/workflows/ampunreal.yml"]
  pull_request:
    paths: ["AmpUnreal/**", ".github/workflows/ampunreal.yml"]
  workflow_dispatch:

env:
  # Self-hosted runners provide this instead; used by the engine job.
  UNREAL_ROOT: /home/kodr/UnrealEngine/Engine

jobs:
  # Fast, always runs: the vendored protocol core under UE build flags
  ampcore:
    name: AmpCore (UE flags + golden vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and validate under -fno-exceptions -fno-rtti
        run: |
          cd AmpUnreal/Source/AmpUnreal/Private/AmpCore
          g++ -std=c++17 -fno-exceptions -fno-rtti -Wall -I. \
            $GITHUB_WORKSPACE/.github/ampcore_check.cpp AmpCore.cpp Keccak256.cpp \
            -o /tmp/ampcore_check
          /tmp/ampcore_check

  # Full engine compile via UnrealBuildTool. Runs on a self-hosted runner
  # labeled `unreal` (any machine with UE installed + UNREAL_ROOT set).
  # Trigger manually, or it runs automatically once the runner is online.
  #
  # Setup (one time):
  #   1. Install UE for Linux (unrealengine.com/linux → download the zip)
  #   2. Register this repo's self-hosted runner with the `unreal` label
  #      (repo Settings → Actions → Runners → New self-hosted runner)
  engine:
    name: Build plugin (RunUAT, self-hosted)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, unreal]
    steps:
      - uses: actions/checkout@v4
      - name: RunUAT BuildPlugin
        run: |
          "$UNREAL_ROOT/Build/BatchFiles/RunUAT.sh" BuildPlugin \
            -Plugin="$GITHUB_WORKSPACE/AmpUnreal/AmpUnreal.uplugin" \
            -Package="/tmp/AmpUnreal-out" \
            -TargetPlatforms=Linux \
            -CookFlavor=
